services:
  postgres:
    image: postgres:16-alpine
    container_name: quotaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quotaflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotaflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-quotaflow_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quotaflow_user} -d ${POSTGRES_DB:-quotaflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quotaflow-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: quotaflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-quotaflow_user}:${POSTGRES_PASSWORD:-quotaflow_secret}@postgres:5432/${POSTGRES_DB:-quotaflow_db}?schema=public
      API_BASE_URL: http://localhost:4000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-qf_admin_dev_bootstrap_secret_key_2026}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 120
      WEBHOOK_WORKER_INTERVAL_MS: 3000
      WEBHOOK_MAX_RETRIES: 3
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - quotaflow-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: quotaflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      INTERNAL_API_URL: http://api:4000
    ports:
      - "3000:3000"
    networks:
      - quotaflow-net

volumes:
  pgdata:
    name: quotaflow_pgdata

networks:
  quotaflow-net:
    name: quotaflow-net
    driver: bridge
